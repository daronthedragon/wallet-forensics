name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The core is vendored from the skill repo, which must stay installable
      # on its own. This is the check that was missing when the two
      # implementations silently diverged.
      - name: Vendored core matches upstream
        run: |
          fail=0
          while read -r sum file; do
            curl -fsSL --retry 3               "https://raw.githubusercontent.com/daronthedragon/wallet-forensics-skill/main/core/$file"               -o /tmp/upstream-core
            [ -s /tmp/upstream-core ] || { echo "::error::upstream $file fetch was empty"; exit 1; }
            got=$(sha256sum /tmp/upstream-core | cut -d' ' -f1)
            if [ "$got" != "$sum" ]; then
              echo "::error::$file has drifted from upstream"
              echo "  upstream $got"
              echo "  vendored $sum"
              fail=1
            else
              echo "  $file in sync"
            fi
          done < src/core/.upstream.sha256
          [ "$fail" = 0 ] || { echo "run scripts/sync-core.sh to refresh"; exit 1; }

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
      - name: MCP protocol contract
        run: |
          {
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}' 
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' 
          } | node dist/mcp/server.js > mcp-out.txt
          cat mcp-out.txt
          grep -q '"serverInfo"' mcp-out.txt || { echo "no serverInfo in initialize result"; exit 1; }
          grep -q '"analyze_wallet"' mcp-out.txt || { echo "tool not advertised"; exit 1; }
          echo "MCP handshake and tools/list OK"


      - name: CLI runs from the build output
        run: node dist/index.js --help | grep -q -- "--all-evm"
